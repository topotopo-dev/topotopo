<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopoTopo Preview</title>
<style>
  :root { --bg: #1b1d21; --panel: #23262b; --line: #34383f; --text: #d9dde3; --dim: #8b929c; --accent: #f0a23b; --err: #ff6b6b; --ok: #7bc47f; --hover: #2c3036; --sel: #3a3f47; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #side { width: 300px; min-width: 220px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #side header { padding: 12px; border-bottom: 1px solid var(--line); }
  #side h1 { font-size: 14px; margin: 0 0 8px; letter-spacing: .04em; }
  select, button, input { background: #2d3137; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  select { width: 100%; }
  #status { font-size: 11px; color: var(--dim); margin-top: 6px; overflow-wrap: anywhere; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  #status.busy { color: var(--accent); }
  #ask { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  #ask[hidden] { display: none; }
  #ask span { flex-basis: 100%; overflow-wrap: anywhere; }
  #ask button { padding: 2px 10px; }
  #ask .yes { border-color: var(--accent); color: var(--accent); }
  #scroll { overflow: auto; flex: 1; }
  details.sec { border-bottom: 1px solid var(--line); }
  details.sec > summary { display: flex; gap: 6px; padding: 8px 12px; cursor: pointer; list-style: none; user-select: none; color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: '▸'; width: 10px; }
  details.sec[open] > summary::before { content: '▾'; }
  details.sec > summary .count { margin-left: auto; letter-spacing: 0; }
  .none, .hint, .where { padding: 0 6px 6px; color: var(--dim); font-size: 12px; }
  .hint, .where { font-size: 11px; padding-top: 4px; }
  .where { overflow-wrap: anywhere; }
  .sub { padding: 8px 4px 2px; color: var(--dim); font-size: 11px; }
  #controls, #inputs, #nodes { padding: 0 6px 8px; }
  .ctl { display: flex; align-items: center; gap: 4px; min-height: 30px; padding: 2px 4px; border-radius: 6px; }
  .ctl:hover { background: var(--hover); }
  .ctl > .cl { flex: 0 0 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctl > .cw { flex: 1; display: flex; gap: 4px; align-items: center; min-width: 0; }
  .cw input { padding: 3px 5px; }
  .cw input[type=range] { flex: 1; min-width: 40px; padding: 0; border: 0; background: none; accent-color: var(--accent); }
  .cw input[type=number] { width: 60px; }
  .cw input.vec { flex: 1; width: 0; min-width: 0; }
  .cw input[type=text] { flex: 1; width: 0; min-width: 0; }
  .cw input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  .cw input[type=color] { width: 44px; height: 24px; padding: 1px 2px; }
  .cw select { flex: 1; width: 0; min-width: 0; padding: 3px 4px; }
  .cw .bad { border-color: var(--err); }
  .ib { flex: 0 0 22px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--dim); cursor: pointer; display: grid; place-items: center; font-size: 14px; line-height: 1; }
  .ib:hover:not(:disabled) { background: var(--sel); color: var(--text); }
  .ib:disabled { opacity: .25; cursor: default; }
  .ib.on { color: var(--accent); }
  .ib.gone { visibility: hidden; }
  .inp { padding: 3px 4px; border-radius: 6px; }
  .inp:hover { background: var(--hover); }
  .inp.sel { background: var(--sel); }
  .inp label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .inp input { accent-color: var(--accent); margin: 0; }
  .inp .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inp .mt { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .inp .er { color: var(--err); font-size: 11px; padding: 2px 0 2px 19px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .node { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  .node:hover { background: var(--hover); }
  .node.sel { background: var(--sel); }
  .node .t { color: var(--dim); font-size: 11px; }
  .node.out .n::before { content: '● '; color: var(--accent); }
  .node.err .n { color: var(--err); }
  #markers { padding: 0 6px 8px; }
  #mk-modes { display: flex; gap: 4px; padding: 0 0 6px; }
  #mk-modes button { flex: 1 1 auto; min-width: 0; padding: 4px 0; font-size: 11px; white-space: nowrap; cursor: pointer; }
  #mk-modes button[data-kind]::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 3px; vertical-align: 1px; }
  .mk { display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 4px; border-radius: 6px; cursor: pointer; }
  .mk:hover { background: var(--hover); }
  .mk.sel { background: var(--sel); }
  .mk .dot { flex: 0 0 8px; height: 8px; border-radius: 50%; }
  .mk input { flex: 1; width: 0; min-width: 0; padding: 2px 5px; border-color: transparent; background: none; }
  .mk input:hover, .mk input:focus { border-color: var(--line); background: #2d3137; }
  .mk input.bad { border-color: var(--err); }
  .mk .mt { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #mk-fields .ctl > .cl { flex-basis: 150px; }
  #main { flex: 1; position: relative; }
  canvas { display: block; }
  #bar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
  #info { position: absolute; bottom: 10px; left: 10px; right: 10px; white-space: pre-wrap; font: 12px/1.35 ui-monospace, Consolas, monospace; color: var(--dim); pointer-events: none; text-shadow: 0 1px 2px #000; }
  #err { position: absolute; top: 50px; left: 10px; right: 10px; color: var(--err); white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #drop { position: fixed; inset: 8px; z-index: 10; display: none; align-items: center; justify-content: center; text-align: center; border: 2px dashed var(--accent); border-radius: 12px; background: rgba(240, 162, 59, .08); color: var(--accent); font-size: 16px; pointer-events: none; }
  body.dropping #drop { display: flex; }
</style>

</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>TOPOTOPO · PREVIEW</h1>
      <select id="graph"></select>
      <div id="status">connecting…</div>
      <div id="ask" hidden><span id="ask-text"></span><button id="ask-yes" class="yes">Yes</button><button id="ask-no">No</button></div>
    </header>
    <div id="scroll">
      <details class="sec" id="controls-sec" open><summary>Controls<span class="count" id="controls-count"></span></summary><div id="controls"></div></details>
      <details class="sec" id="markers-sec" open><summary>Markers<span class="count" id="markers-count"></span></summary>
        <div id="markers">
          <div id="mk-modes">
            <button data-mode="site" data-kind style="--c:#ffb454" title="click in the view to place a site (a point with a radius)">Site</button>
            <button data-mode="path" data-kind style="--c:#59d0ff" title="click points along a path; Enter or double-click finishes">Path</button>
            <button data-mode="zone" data-kind style="--c:#9be36b" title="click the corners of an area; Enter or double-click closes it">Zone</button>
            <button data-mode="volume" data-kind style="--c:#ff7ab8" title="drag a rectangle; the box rises by the height field">Volume</button>
            <button data-mode="select" title="click a marker in the view to select it">Select</button>
          </div>
          <div id="mk-list"></div>
          <div id="mk-fields"></div>
        </div>
      </details>
      <details class="sec" id="inputs-sec" open><summary>Inputs<span class="count" id="inputs-count"></span></summary><div id="inputs"></div></details>
      <details class="sec" id="nodes-sec" open><summary>Nodes<span class="count" id="nodes-count"></span></summary><div id="nodes"></div></details>
    </div>
  </aside>
  <main id="main">
    <div id="bar">
      <button id="follow" class="on" title="show the graph output; otherwise the selected node">follow output</button>
      <button id="wire">wireframe</button>
      <button id="frame" title="frame the output and the reference layers">frame</button>
      <button id="infobtn" title="show the whole geometry summary">info</button>
    </div>
    <div id="err"></div>
    <div id="info"></div>
  </main>
</div>
<div id="drop">drop files to add them to <span id="drop-where">inputs/</span><br>they show here as grey reference layers</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const MAX_UPLOAD = 512 * 1024 * 1024; // POST /api/inputs limit (src/viewer/server.ts)
const LIVE = 'live — updates on every build/edit';
const main = $('main');
// logarithmic depth: a 1 km terrain and a door handle in one view without near-plane clipping or z-fighting
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
main.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2d33);
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 5000);
camera.position.set(4, 3, 5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.zoomToCursor = true; // wheel zooms towards what is under the cursor, not the scene centre
controls.zoomSpeed = 2;
// reference layers: the human's input files, ghosted, kept while the graph output refreshes
const refs = new THREE.Group();
scene.add(refs);
// double-click: orbit around the surface point under the cursor
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('dblclick', (e) => {
  if (mk.mode) return; // a marker mode uses double-clicks (finishing a path or zone)
  const targets = [current, ...refs.children].filter(Boolean);
  if (!targets.length) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(targets, true).find((h) => h.object.isMesh);
  if (hit) { camera.position.add(hit.point.clone().sub(controls.target)); controls.target.copy(hit.point); }
});
scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x3b342c, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 6, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.6); fill.position.set(5, 2, -3); scene.add(fill);
let grid = new THREE.GridHelper(10, 10, 0x666a72, 0x41454c); scene.add(grid);
const axes = new THREE.AxesHelper(0.5); scene.add(axes);

let state = { graphs: [], graph: null, node: null, follow: true, wire: false, framed: false };
let current = null;
const loader = new GLTFLoader();

function resize() {
  const w = main.clientWidth, h = main.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

function frame(...objs) {
  const box = new THREE.Box3();
  for (const o of objs) if (o) box.expandByObject(o);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 1e-3);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (!Number.isFinite(dir.x) || dir.length() < 0.5) dir.set(0.6, 0.45, 0.7).normalize();
  camera.position.copy(c).addScaledVector(dir, r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1);
  camera.near = r / 100000; camera.far = r * 100; camera.updateProjectionMatrix();
  controls.target.copy(c);
  scene.remove(grid);
  const step = Math.pow(10, Math.floor(Math.log10(r)));
  const ext = Math.ceil(r * 3 / step) * step;
  grid = new THREE.GridHelper(ext * 2, Math.round(ext * 2 / step), 0x666a72, 0x41454c);
  grid.position.set(Math.round(c.x / step) * step, 0, Math.round(c.z / step) * step);
  scene.add(grid);
}
const frameAll = () => frame(current, ...refs.children, ...markerGroup.children);
function inView(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return true;
  camera.updateMatrixWorld();
  return new THREE.Frustum().setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)).intersectsBox(box);
}

function applyWire(obj) {
  obj.traverse((o) => { if (o.isMesh) { o.material.wireframe = state.wire; o.material.side = THREE.DoubleSide; } });
}
/** Free an object's geometry, materials and their textures (the ghost materials are shared and stay). */
function dispose(obj) {
  obj.traverse((o) => {
    o.geometry?.dispose();
    for (const m of [o.material ?? []].flat()) {
      if (Object.values(ghost).includes(m)) continue;
      for (const v of Object.values(m)) if (v?.isTexture) v.dispose();
      m.dispose();
    }
  });
}

function setStatus(text, kind = '') { const s = $('status'); s.textContent = text; s.className = kind; s.title = text; }

/** At most one run of fn at a time; calls during a run ask for one more run after it, and wait for that. */
function coalesce(fn) {
  let busy = null, again = false;
  return () => {
    if (busy) { again = true; return busy; }
    busy = (async () => { try { do { again = false; await fn(); } while (again); } finally { busy = null; } })();
    return busy;
  };
}

let cookFailed = false;
const loadGeo = coalesce(async () => {
  if (!state.graph) return;
  const g = state.graphs.find((x) => x.name === state.graph);
  if (!state.follow && !g?.nodes.some((n) => n.name === state.node)) { state.follow = true; state.node = null; $('follow').classList.add('on'); }
  const node = state.follow ? '' : state.node ?? '';
  const q = `graph=${encodeURIComponent(state.graph)}&node=${encodeURIComponent(node)}`;
  const res = await fetch('/api/geo?' + q).catch(() => null);
  if (!res) return; // the server went away; the event stream says so
  if (!res.ok) {
    // the last good geometry stays
    const j = await res.json().catch(() => ({}));
    $('err').textContent = j.error ?? res.statusText;
    cookFailed = true;
    setStatus(`cook failed — ${String(j.error ?? res.statusText).split('\n')[0]}`, 'err');
    return;
  }
  $('err').textContent = '';
  if (cookFailed) { cookFailed = false; if ($('status').className === 'err') setStatus(LIVE); }
  const buf = await res.arrayBuffer();
  const gltf = await new Promise((resolve) => loader.parse(buf, '', resolve, (e) => { $('err').textContent = String(e); resolve(null); }));
  if (!gltf) return;
  if (current) { scene.remove(current); dispose(current); }
  current = gltf.scene;
  current.traverse((o) => {
    if (o.isPoints) o.material.size = 4, o.material.sizeAttenuation = false;
    if (o.isLineSegments) o.material.color?.set(0x4aa3ff);
  });
  applyWire(current);
  scene.add(current);
  placePictures();
  if (!state.framed) { frame(current); state.framed = true; }
  const info = await (await fetch('/api/info?' + q)).json().catch(() => null);
  state.infoText = info?.summary ? `${state.graph}/${info.target}  (${info.ms.toFixed(0)} ms)\n${info.summary}` : '';
  showInfo();
});

// the summary is long for big scenes: two lines unless expanded (the "info" button); a hovered or selected input
// file shows its own summary instead, and a selected marker how agents will read it
function showInfo() {
  const p = inp.hover ?? inp.selected;
  let t = state.infoText ?? '';
  const m = !inp.hover && markerById(mk.selected);
  if (m) {
    const lines = markerInfo(m);
    $('info').textContent = (state.infoOpen ? lines : lines.slice(0, 3)).join('\n');
  } else if (p) {
    const f = inp.list.find((x) => x.path === p), i = inp.info.get(p);
    const head = `inputs/${p}${f ? `  ${fmtSize(f.size)}` : ''}${inp.layers.get(p)?.obj ? '  (reference layer)' : ''}`;
    if (!i || i.pending) t = `${head}\n…`;
    else if (i.error) t = `${head}\n${i.error}`;
    else {
      const lines = i.summary.split('\n');
      t = state.infoOpen ? `${head}\n${i.summary}` : [head, lines.find((l) => l.startsWith('geometry:')), lines.find((l) => l.startsWith('bbox:'))].filter(Boolean).join('\n');
    }
    $('info').textContent = t;
  } else $('info').textContent = state.infoOpen ? t : t.split('\n').slice(0, 2).join('\n');
  $('infobtn').classList.toggle('on', !!state.infoOpen);
}

function renderNodes() {
  const g = state.graphs.find((x) => x.name === state.graph);
  const box = $('nodes');
  box.innerHTML = '';
  $('nodes-count').textContent = g?.nodes.length || '';
  if (!g) return;
  for (const n of g.nodes) {
    const d = document.createElement('div');
    d.className = 'node' + (n.name === g.output ? ' out' : '') + (n.error ? ' err' : '') + (!state.follow && n.name === state.node ? ' sel' : '');
    d.title = n.error ?? `${n.type}${n.in?.length ? ' ← ' + n.in.filter(Boolean).join(', ') : ''}`;
    d.innerHTML = `<span class="n"></span><span class="t"></span>`;
    d.querySelector('.n').textContent = n.name;
    d.querySelector('.t').textContent = n.type + (n.ms != null ? ` · ${n.ms.toFixed(0)}ms` : '');
    d.onclick = () => { state.follow = false; state.node = n.name; inp.selected = null; selectMarker(null); $('follow').classList.remove('on'); renderNodes(); loadGeo(); };
    box.appendChild(d);
  }
}

const refreshGraphs = coalesce(async () => {
  const issued = performance.now();
  const res = await fetch('/api/graphs').catch(() => null);
  if (!res?.ok) return;
  state.graphs = await res.json();
  const sel = $('graph');
  const prev = state.graph;
  const names = state.graphs.map((g) => g.name);
  // the options are rebuilt only when the graphs change, so an open list stays open
  if (names.join('\n') !== [...sel.options].map((o) => o.value).join('\n')) sel.replaceChildren(...names.map((n) => new Option(n, n)));
  if (!state.graphs.length) { setStatus('no graphs yet — build one via MCP'); renderControls(null); return; }
  state.graph = names.includes(prev) ? prev : names[0];
  sel.value = state.graph;
  renderNodes();
  renderControls(state.graphs.find((g) => g.name === state.graph), issued);
});

// ------------------------------------------------------------ controls: the graph's exposed vars
// One control per declared param (graph.params), then the undeclared vars. Values are POSTed to /api/vars (sliders at
// most every 100 ms, plus once on release). Updates from the server set values in place; the panel is rebuilt only
// when the set of params changes.
const ctl = {
  graph: null, sig: null, rows: new Map(), active: null, deferred: null,
  pending: {}, timer: 0, lastSend: -1e9, seq: 0,
  // var → id of its newest POST not answered yet / time its newest POST was answered: older server state is ignored
  unacked: new Map(), ackAt: new Map(),
};
const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const HEX = /^#[0-9a-f]{6}$/i, HEX3 = /^#[0-9a-f]{3}$/i;
const decimals = (x) => { const s = String(x); return s.includes('e-') ? Number(s.split('e-')[1]) : (s.split('.')[1] ?? '').length; };
const fmt = (v) => (isNum(v) ? String(+v.toPrecision(10)) : String(v));
const short = (v) => { const s = typeof v === 'string' ? v : JSON.stringify(v) ?? String(v); return s.length > 24 ? s.slice(0, 23) + '…' : s; };
addEventListener('pointerup', () => endDrag(), true);
addEventListener('pointercancel', () => endDrag(), true);
function endDrag() {
  ctl.active = null;
  // after the slider's own change event (its final value) has been sent
  if (ctl.deferred) setTimeout(() => { if (!ctl.deferred || ctl.active) return; const [g, t] = ctl.deferred; ctl.deferred = null; renderControls(g, t); });
}

function jsonKind(v) {
  if (typeof v === 'boolean') return 'bool';
  if (isNum(v)) return 'number';
  if (typeof v === 'string') return HEX.test(v) ? 'color' : 'text';
  if (Array.isArray(v) && v.length >= 2 && v.length <= 4 && v.every(isNum)) return 'vector';
  return 'json';
}
/** The widget for a var: the declared type when the value fits it, else the value's JSON type. */
function kindOf(vd, v) {
  const t = vd?.type, k = jsonKind(v);
  if (Array.isArray(vd?.options) && vd.options.length && (k === 'text' || k === 'number' || k === 'color')) return 'select';
  if (t === 'color' && (k === 'color' || (k === 'text' && HEX3.test(v)) || (k === 'vector' && v.length >= 3))) return 'color';
  if (t === 'bool' && k === 'number') return 'bool';
  return k;
}
/** A value to show for a declared param that has neither a var nor a default. */
function blank(vd) {
  const t = vd?.type ?? '';
  if (t === 'bool') return false;
  if (t === 'color') return '#ffffff';
  if (/vec(\d)$/.test(t)) return new Array(Number(/vec(\d)$/.exec(t)[1])).fill(0);
  if (t === 'string' || t === 'enum' || vd?.options?.length) return vd?.options?.[0] ?? '';
  return 0;
}
/** Slider range: the VarDef's min/max, else derived from the default (0..4×default, −1..1 for 0); derived ends widen. */
function rangeOf(vd, v, int) {
  let lo = isNum(vd.min) ? vd.min : undefined, hi = isNum(vd.max) ? vd.max : undefined;
  const fixLo = lo !== undefined, fixHi = hi !== undefined;
  const base = isNum(vd.default) ? vd.default : v;
  if (lo === undefined && hi === undefined) [lo, hi] = base === 0 ? [-1, 1] : base > 0 ? [0, 4 * base] : [4 * base, -4 * base];
  else if (lo === undefined) lo = hi > 0 && base >= 0 ? 0 : Math.min(base, hi) - Math.max(1, 4 * Math.abs(base));
  else if (hi === undefined) hi = base > lo ? lo + 4 * (base - lo) : lo + Math.max(1, 4 * Math.abs(lo));
  if (int) { lo = Math.floor(lo); hi = Math.ceil(hi); }
  if (!(hi > lo)) hi = lo + 1;
  const fixStep = isNum(vd.step) && vd.step > 0;
  const r = { lo, hi, fixLo, fixHi, fixStep, int, step: 1 };
  r.step = fixStep ? vd.step : autoStep(r);
  return r;
}
function autoStep(r) {
  const s = 10 ** Math.floor(Math.log10((r.hi - r.lo) / 100));

}

const WIDGETS = {
  number(name, vd, value, cw) {
    // declared int: integer values; an undeclared whole number gets integer slider steps but takes any typed value
    const int = vd.type === 'int', intSteps = int || (vd.type === undefined && Number.isInteger(value));
    let cur = value;
    const r = rangeOf(vd, cur, intSteps);
    const slider = el('input'), box = el('input');
    slider.type = 'range'; box.type = 'number'; box.step = int ? String(r.step) : 'any';
    const fit = () => { slider.min = r.lo; slider.max = r.hi; slider.step = r.step; if (r.fixLo) box.min = r.lo; if (r.fixHi) box.max = r.hi; };
    const widen = (v) => {

      if (lo) r.lo = v;
      if (hi) r.hi = v;
      if ((lo || hi) && !r.fixStep) r.step = autoStep(r);
      if (lo || hi) fit();

    const snap = (v) => +(r.lo + Math.round((v - r.lo) / r.step) * r.step).toFixed(Math.min(12, Math.max(decimals(r.step), decimals(r.lo))));

      let v = Number(box.value);
      if (box.value.trim() === '' || !Number.isFinite(v)) return show();

      if (r.fixLo) v = Math.max(v, r.lo);
      if (r.fixHi) v = Math.min(v, r.hi);
      widen(v); cur = v; show(); queueVar(name, v, true);
    });
    cw.append(slider, box);
    fit(); widen(cur); show();
    return { set(v) { if (!isNum(v)) return; cur = v; widen(v); show(); }, get: () => cur, typing: () => document.activeElement === box };
  },
  bool(name, vd, value, cw) {
    const asNum = isNum(value), box = el('input');
    box.type = 'checkbox';
    const get = () => (asNum ? (box.checked ? 1 : 0) : box.checked);
    box.onchange = () => queueVar(name, get(), true);
    cw.append(box);
    const set = (v) => { box.checked = !!v; };
    set(value);
    return { set, get };
  },
  select(name, vd, value, cw) {
    const opts = vd.options.map(String);

    const byIndex = isNum(value) && !opts.includes(String(value));
    const s = el('select');
    for (const o of opts) s.append(new Option(o, o));
    const get = () => (byIndex ? opts.indexOf(s.value) : s.value);
    const set = (v) => {
      const k = byIndex ? opts[v] : String(v);
      if (k === undefined) return;
      // a value outside the options (set by an agent or by hand) is shown as an extra entry while it holds
      for (const o of [...s.options]) if (!opts.includes(o.value) && o.value !== k) o.remove();
      if (![...s.options].some((o) => o.value === k)) s.append(new Option(k, k));
      s.value = k;
    };

    cw.append(s); set(value);
    return { set, get };
  },
  text(name, vd, value, cw) {
    const t = el('input');
    t.type = 'text'; t.spellcheck = false;
    t.onchange = () => queueVar(name, t.value, true);
    cw.append(t);
    const set = (v) => { t.value = v == null ? '' : String(v); };
    set(value);
    return { set, get: () => t.value, typing: () => document.activeElement === t };
  },
  vector(name, vd, value, cw) {
    const int = /^ivec/.test(vd.type ?? '');
    let cur = value.slice();
    const fields = cur.map((_, i) => {
      const f = el('input', 'vec');
      f.type = 'number'; f.step = int ? '1' : 'any'; f.title = `${name}.${'xyzw'[i]}`;
      f.onchange = () => {
        let v = Number(f.value);

        if (int) v = Math.round(v);

  color(name, vd, value, cw) {

    const hex = (v) => (arr ? '#' + v.slice(0, 3).map((x) => Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16).padStart(2, '0')).join('')

    set(value);

  json(name, vd, value, cw) {
    const t = el('input');

      try { cur = JSON.parse(t.value); } catch { t.classList.add('bad'); return; }

    };

    const set = (v) => { cur = v; t.value = JSON.stringify(v) ?? ''; t.classList.remove('bad'); };
    set(value);
    return { set, get: () => cur, typing: () => document.activeElement === t };
  },
};

function controlRow(name, vd, value) {
  const declared = !!vd;
  vd = vd ?? {};
  const def = declared ? vd.default : undefined;
  if (value === undefined) value = def !== undefined ? def : blank(vd);
  const label = (typeof vd.label === 'string' && vd.label) || name;
  const wrap = el('div', 'ctl'), cw = el('div', 'cw');
  wrap.title = [label !== name ? name : '', declared ? vd.desc : 'not declared in the graph\'s "params"'].filter(Boolean).join(' — ');
  const w = WIDGETS[kindOf(declared ? vd : null, value)](name, vd, value, cw);
  const reset = el('button', 'ib' + (def === undefined ? ' gone' : ''), '↺');
  if (def !== undefined) reset.title = `reset ${name} to ${short(def)}`;
  reset.onclick = () => { w.set(def); queueVar(name, def, true); };
  wrap.append(el('span', 'cl', label), cw, reset);
  const row = {
    def,
    set(v) { w.set(v); row.sync(); },
    typing: () => w.typing?.() ?? false,
    sync() { reset.disabled = def === undefined || same(w.get(), def); },
  };
  row.sync();
  ctl.rows.set(name, row);
  return wrap;
}

function renderControls(g, issued = performance.now()) {
  const params = g?.params ?? {}, vars = g?.vars ?? {};
  const other = Object.keys(vars).filter((k) => !(k in params));
  const sig = g ? JSON.stringify([g.name, params, other.map((k) => [k, jsonKind(vars[k]), Array.isArray(vars[k]) ? vars[k].length : 0])]) : '';
  if (sig === ctl.sig) return applyValues(vars, issued);
  // the set of params changed: rebuild, but not under a slider being dragged
  if (ctl.active && g?.name === ctl.graph) { ctl.deferred = [g, issued]; return; }
  if (ctl.graph !== (g?.name ?? null)) {
    if (ctl.graph) flushVars();
    ctl.pending = {}; ctl.unacked.clear(); ctl.ackAt.clear();
  }
  ctl.graph = g?.name ?? null; ctl.sig = sig; ctl.rows.clear();
  const box = $('controls');
  box.replaceChildren();
  const declared = Object.keys(params);
  $('controls-count').textContent = declared.length + other.length || '';
  if (!declared.length && !other.length) { box.append(el('div', 'none', g ? 'none — this graph exposes no vars' : 'none')); return; }
  for (const k of declared) box.append(controlRow(k, params[k] ?? {}, vars[k]));
  if (other.length) {
    box.append(el('div', 'sub', declared.length ? 'other vars' : 'vars (none declared in "params")'));
    for (const k of other) box.append(controlRow(k, null, vars[k]));
  }
}

/** Server state into the controls, except where the user has edits on the way or is dragging/typing. */
function applyValues(vars, issued) {
  for (const [k, row] of ctl.rows) {
    if (k in ctl.pending || ctl.unacked.has(k) || (ctl.ackAt.get(k) ?? -1e9) > issued || ctl.active === k || row.typing()) continue;
    row.set(k in vars ? vars[k] : row.def);
  }
}

function queueVar(name, value, final = false) {
  ctl.pending[name] = value;
  ctl.rows.get(name)?.sync();
  if (final) return flushVars();
  const wait = 100 - (performance.now() - ctl.lastSend);
  if (wait <= 0) flushVars();
  else if (!ctl.timer) ctl.timer = setTimeout(flushVars, wait);
}

async function flushVars() {
  clearTimeout(ctl.timer); ctl.timer = 0;
  const vars = ctl.pending, graph = ctl.graph;
  if (!graph || !Object.keys(vars).length) return;
  ctl.pending = {};
  const id = ++ctl.seq;
  ctl.lastSend = performance.now();
  for (const k in vars) ctl.unacked.set(k, id);
  let j;
  try {
    const res = await fetch(`/api/vars?graph=${encodeURIComponent(graph)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ vars }) });
    j = await res.json().catch(() => ({ ok: false, errors: [`${res.status} ${res.statusText}`] }));
  } catch { j = { ok: false, errors: ['the viewer server is not answering'] }; }
  const now = performance.now();
  for (const k in vars) if (ctl.unacked.get(k) === id) { ctl.unacked.delete(k); ctl.ackAt.set(k, now); }
  if (graph !== ctl.graph) return;
  const what = Object.entries(vars).map(([k, v]) => `${k} = ${short(v)}`).join(', ');
  if (j.ok) setStatus(`${what} · cooked in ${Math.round(j.ms)} ms`, 'ok');
  else setStatus(`${j.vars ? `${what} applied, cook failed` : `${what} not applied`} — ${(j.errors ?? []).join('; ') || 'unknown error'}`, 'err');
  if (j.vars) applyValues(j.vars, now);

// ------------------------------------------------------------ inputs: the human's files as reference layers
const ghost = {
  mesh: new THREE.MeshStandardMaterial({ color: 0xaab0ba, roughness: 0.85, metalness: 0, transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide }),
  line: new THREE.LineBasicMaterial({ color: 0xc4cad4, transparent: true, opacity: 0.6, depthWrite: false }),
  point: new THREE.PointsMaterial({ color: 0xc4cad4, size: 3, sizeAttenuation: false, transparent: true, opacity: 0.75, depthWrite: false }),
};
const inp = { list: [], rows: new Map(), layers: new Map(), info: new Map(), errors: new Map(), checked: new Set(), hover: null, selected: null, restored: false, where: '' };
const stampOf = (f) => `${f.mtime}:${f.size}`;
const fmtSize = (n) => (n < 1024 ? `${n} B` : n < 1024 ** 2 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1024 ** 2).toFixed(1)} MB`);
const errText = (e) => String(e?.message ?? e).replace(/^\[f\] /gm, '');
// the checked files are remembered per viewer address (a convenience: a reload shows the same layers)
const MEMO = `topotopo.viewer.refs.${location.host}`;
const remember = () => { try { localStorage.setItem(MEMO, JSON.stringify([...inp.checked])); } catch { /* storage blocked */ } };
const recall = () => { try { const v = JSON.parse(localStorage.getItem(MEMO) ?? '[]'); return Array.isArray(v) ? v : []; } catch { return []; } };

/** A PNG arrives as flat quads with unlit materials named "image:<name>" (withImagePreview): a picture, not a place. */
function isPicture(root) {
  let meshes = 0, all = true;
  root.traverse((o) => { if (o.isMesh) { meshes++; all &&= [o.material].flat().every((m) => m.name?.startsWith('image:')); } });
  return meshes > 0 && all;
}
/** Pictures keep their pixels and stand in a row right of the output and the other layers, half as wide as those. */
function placePictures() {
  const pics = inp.list.map((f) => inp.layers.get(f.path)?.obj).filter((o) => o?.userData.picture);
  if (!pics.length) return;
  const box = new THREE.Box3();
  for (const o of [current, ...refs.children]) if (o && !o.userData.picture) box.expandByObject(o);
  const empty = box.isEmpty(), size = empty ? new THREE.Vector3() : box.getSize(new THREE.Vector3());
  const s = Math.max(1, Math.max(size.x, size.z) / 2), gap = 0.1 * s;
  let x = empty ? 0 : box.max.x + gap;
  for (const o of pics) {
    o.position.set(0, 0, 0); o.scale.setScalar(1); o.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(o);
    o.scale.setScalar(s);
    o.position.set(x - b.min.x * s, (empty ? 0 : box.min.y) - b.min.y * s, empty ? 0 : (box.min.z + box.max.z) / 2);
    x += (b.max.x - b.min.x) * s + gap;
  }
}
function ghostify(root) {
  root.traverse((o) => {
    if (!o.material) return;
    for (const m of [o.material].flat()) { for (const v of Object.values(m)) if (v?.isTexture) v.dispose(); m.dispose(); }
    o.material = o.isPoints ? ghost.point : o.isLine ? ghost.line : ghost.mesh;

function dropLayer(p) {
  const l = inp.layers.get(p);
  if (!l) return;
  inp.layers.delete(p);
  if (l.obj) { refs.remove(l.obj); dispose(l.obj); placePictures(); }
}
async function loadLayer(p) {
  const f = inp.list.find((x) => x.path === p);
  if (!f) return;
  dropLayer(p);
  const entry = { stamp: stampOf(f), obj: null };
  inp.layers.set(p, entry);
  inp.errors.delete(p);
  renderInputs();
  try {
    const res = await fetch('/api/input?path=' + encodeURIComponent(p));
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `${res.status} ${res.statusText}`);
    const buf = await res.arrayBuffer();
    const gltf = await new Promise((resolve, reject) => loader.parse(buf, '', resolve, reject));
    if (inp.layers.get(p) !== entry) { dispose(gltf.scene); return; } // unchecked or replaced meanwhile
    gltf.scene.userData.picture = isPicture(gltf.scene);
    if (!gltf.scene.userData.picture) ghostify(gltf.scene);
    gltf.scene.name = `inputs/${p}`;
    entry.obj = gltf.scene;
    refs.add(gltf.scene);
    placePictures();
    if (!current || !inView(gltf.scene)) frameAll();
    if (inp.selected === p || inp.hover === p) fetchInfo(p);

    if (inp.layers.get(p) === entry) {
      inp.layers.delete(p); inp.checked.delete(p); remember();

async function fetchInfo(p) {
  const f = inp.list.find((x) => x.path === p);
  if (!f) return;
  const stamp = stampOf(f), have = inp.info.get(p);
  if (have && have.stamp === stamp) return;
  inp.info.set(p, { stamp, pending: true });
  try {
    const res = await fetch('/api/input_info?path=' + encodeURIComponent(p));
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error ?? `${res.status} ${res.statusText}`);
    inp.info.set(p, { stamp, summary: String(j.summary ?? '') });
  } catch (e) {
    inp.info.set(p, { stamp, error: errText(e) });
    inp.errors.set(p, { stamp, msg: errText(e) });
    renderInputs();
  }

}

function inputRow(p) {
  const row = el('div', 'inp'), lab = el('label'), cb = el('input'), mt = el('span', 'mt'), er = el('div', 'er');
  cb.type = 'checkbox';
  lab.append(cb, el('span', 'nm', p), mt);
  row.append(lab, er);
  cb.onchange = () => {
    if (cb.checked) { inp.checked.add(p); inp.selected = p; selectMarker(null); loadLayer(p); fetchInfo(p); }
    else { inp.checked.delete(p); dropLayer(p); if (inp.selected === p) inp.selected = null; }
    remember(); renderInputs(); showInfo();
  };
  let timer = 0;
  row.onmouseenter = () => { inp.hover = p; showInfo(); clearTimeout(timer); timer = setTimeout(() => fetchInfo(p), 150); };
  row.onmouseleave = () => { clearTimeout(timer); if (inp.hover === p) inp.hover = null; showInfo(); };
  return {
    el: row,
    update(f) {
      cb.checked = inp.checked.has(p);
      const l = inp.layers.get(p);
      mt.textContent = l && !l.obj ? 'loading…' : fmtSize(f.size);
      row.title = `inputs/${p} · ${f.kind}${f.ext ? ` (.${f.ext})` : ''} · ${fmtSize(f.size)} · ${new Date(f.mtime).toLocaleString()}`;
      row.classList.toggle('sel', inp.selected === p);

// where dropped files go (GET /api/inputs_dir): "in the workspace", or "beside house.json" under `topotopo view`
const whereLine = el('div', 'where');
whereLine.hidden = true;
async function loadWhere() {
  const j = await fetch('/api/inputs_dir').then((r) => (r.ok ? r.json() : null)).catch(() => null);
  if (!j?.where) return;
  inp.where = String(j.where);
  whereLine.textContent = `files go to inputs/ ${inp.where}; a file node reads them as inputs/<name>`;
  whereLine.title = String(j.dir ?? '');
  whereLine.hidden = false;
  $('drop-where').textContent = `inputs/ ${inp.where}`;
}
function renderInputs() {
  const box = $('inputs');
  $('inputs-count').textContent = inp.list.length || '';
  if (!inp.list.length) {
    inp.rows.clear();
    box.replaceChildren(el('div', 'none', 'none yet — drop files anywhere on this page (OBJ, STL, PLY, glTF/GLB, Houdini .geo, CSV, points JSON, PNG)'), whereLine);
    return;
  }
  box.querySelector('.none')?.remove();
  let hint = box.querySelector('.hint');
  if (!hint) { hint = el('div', 'hint', 'checked files show as grey reference layers (PNGs as pictures beside them); drop more files anywhere'); box.append(hint); }
  if (hint.nextSibling !== whereLine) hint.after(whereLine);
  // rows are kept and updated in place, in list order
  const seen = new Set();
  let prev = null;
  for (const f of inp.list) {
    seen.add(f.path);
    let r = inp.rows.get(f.path);
    if (!r) { r = inputRow(f.path); inp.rows.set(f.path, r); }
    r.update(f);
    const want = prev ? prev.nextSibling : box.firstChild;
    if (r.el !== want) box.insertBefore(r.el, want);
    prev = r.el;
  }
  for (const [p, r] of inp.rows) if (!seen.has(p)) { r.el.remove(); inp.rows.delete(p); }
}
const refreshInputs = coalesce(async () => {
  const res = await fetch('/api/inputs').catch(() => null);
  if (!res?.ok) return;
  inp.list = await res.json();
  const byPath = new Map(inp.list.map((f) => [f.path, f]));
  if (!inp.restored) { inp.restored = true; for (const p of recall()) if (byPath.has(p)) inp.checked.add(p); }
  // a replaced file reloads its layer and summary; a removed one goes away
  for (const p of [...inp.checked]) {
    const f = byPath.get(p);
    if (!f) { inp.checked.delete(p); dropLayer(p); continue; }
    const l = inp.layers.get(p);
    if (!l || l.stamp !== stampOf(f)) loadLayer(p);
  }
  for (const m of [inp.info, inp.errors]) for (const [p, v] of m) if (!byPath.has(p) || v.stamp !== stampOf(byPath.get(p))) m.delete(p);
  if (inp.selected && !byPath.has(inp.selected)) inp.selected = null;
  if (inp.hover && !byPath.has(inp.hover)) inp.hover = null;
  remember(); renderInputs(); showInfo();
});

/** A small question under the status line; resolves to the user's answer. */
function ask(text, yes = 'Yes', no = 'No') {
  return new Promise((resolve) => {
    $('ask-text').textContent = text; $('ask-yes').textContent = yes; $('ask-no').textContent = no;
    $('ask').hidden = false;
    const done = (v) => { $('ask').hidden = true; $('ask-yes').onclick = $('ask-no').onclick = null; resolve(v); };
    $('ask-yes').onclick = () => done(true);
    $('ask-no').onclick = () => done(false);
    $('ask-yes').focus();
  });
}
async function uploadOne(f, tag) {
  if (f.size > MAX_UPLOAD) return { error: `${f.name}: ${fmtSize(f.size)} is over the ${MAX_UPLOAD / 1024 ** 2} MB limit` };
  const put = async (overwrite) => {
    const t0 = performance.now();
    const tick = () => setStatus(`uploading ${f.name}${tag} · ${fmtSize(f.size)} · ${((performance.now() - t0) / 1000).toFixed(0)} s`, 'busy');
    tick();
    const timer = setInterval(tick, 500);
    try {
      const res = await fetch(`/api/inputs?name=${encodeURIComponent(f.name)}&overwrite=${overwrite ? 1 : 0}`, { method: 'POST', body: f });
      return { status: res.status, j: await res.json().catch(() => ({})) };
    } catch (e) { return { status: 0, j: { error: `upload failed: ${e?.message ?? e}` } }; }
    finally { clearInterval(timer); }
  };

  if (moved < 5 || Math.abs(d.b.x - d.a.x) < 0.01 || Math.abs(d.b.z - d.a.z) < 0.01) return modeStatus(' · drag to draw the box');
  addMarker({ kind: 'volume', points: [[mm(d.a.x), mm(d.y), mm(d.a.z)], [mm(d.b.x), mm(d.y), mm(d.b.z)]], height: mk.defaults.height });
}
cv.addEventListener('pointerdown', (e) => {
  if (!mk.mode || e.button !== 0) return;
  mk.down = { x: e.clientX, y: e.clientY };
  if (mk.mode !== 'volume') return;
  const hit = pickPoint(e);
  if (hit) { mk.draft = { kind: 'volume', y: hit.p.y, a: hit.p.clone(), b: hit.p.clone() }; drawDraft(); }
});
cv.addEventListener('pointermove', (e) => {
  if (!mk.mode) return;
  if (mk.draft?.kind === 'volume') {
    if (!mk.down) return;
    const p = onPlane(e, mk.draft.y);
    if (p) { mk.draft.b = p; queueDraft(); modeStatus(); }
  } else if (mk.draft?.points.length) {
    // the rubber band to the pointer, on the last point's level (a cheap stand-in for the surface under it)
    mk.cursor = onPlane(e, mk.draft.points[mk.draft.points.length - 1][1]);
    queueDraft();
  }
});
cv.addEventListener('pointerup', (e) => {
  if (!mk.mode || e.button !== 0 || !mk.down) return;
  const moved = Math.hypot(e.clientX - mk.down.x, e.clientY - mk.down.y);
  mk.down = null;
  if (mk.mode === 'volume') finishBox(moved);
  else if (moved <= 5) clickAt(e); // a longer move turned the view
});
cv.addEventListener('pointercancel', () => { mk.down = null; if (mk.draft?.kind === 'volume') { mk.draft = null; drawDraft(); } });
// a double-click slower than the click test above: drop the point its second click added, then finish
cv.addEventListener('dblclick', () => {
  const P = mk.draft?.points;
  if (!P) return;
  const [a, b] = P.slice(-2).map((p) => toScreen(V3(p)));
  if (P.length >= 2 && a && b && Math.hypot(a[0] - b[0], a[1] - b[1]) < 6) P.pop();
  finishDraft();
});
cv.addEventListener('pointerleave', () => { if (mk.cursor) { mk.cursor = null; queueDraft(); } });
addEventListener('keydown', (e) => {
  if (!mk.mode) return;
  const t = e.target;
  if (t instanceof HTMLInputElement || t instanceof HTMLSelectElement || t instanceof HTMLTextAreaElement || t?.isContentEditable) return;
  if (e.key === 'Escape') { if (mk.draft) { mk.draft = null; mk.cursor = null; drawDraft(); modeStatus(' · cancelled'); } else setMode(null); }
  else if (e.key === 'Enter' && mk.draft?.points) finishDraft();
  else if (e.key === 'Backspace' && mk.draft?.points) { mk.draft.points.pop(); if (!mk.draft.points.length) { mk.draft = null; mk.cursor = null; } drawDraft(); modeStatus(); }
  else return;
  e.preventDefault(); // a focused button must not click on Enter
});

// the list, the selected marker's fields and the info panel
function addMarker(m) {
  const marker = { id: newId(), kind: m.kind, name: nextName(m.kind), points: m.points, ...(m.kind === 'site' ? { radius: m.radius } : {}), ...(m.kind === 'volume' ? { height: m.height } : {}) };
  mk.list.push(marker);
  mk.selected = marker.id;
  if (inp.selected) { inp.selected = null; renderInputs(); }
  markersChanged();
  modeStatus(` · added ${marker.name}`);
}
function selectMarker(id) {
  mk.selected = markerById(id) ? id : null;
  if (mk.selected && inp.selected) { inp.selected = null; renderInputs(); }
  renderMarkers(); showInfo();
}
function deleteMarker(id) {
  const m = markerById(id);
  if (!m) return;
  mk.list = mk.list.filter((o) => o !== m);
  if (mk.selected === id) mk.selected = null;
  markersChanged();
  markerNote(`deleted ${m.name}`);
}
function renameMarker(id, input) {
  const m = markerById(id);
  if (!m) return;
  const name = input.value.normalize('NFC').trim();
  const clash = mk.list.find((o) => o !== m && o.name.toLowerCase() === name.toLowerCase());
  if (!name || clash) {
    markerNote(name ? `"${name}" is taken by another marker: names must be unique` : 'a marker needs a name', 'err');
    input.value = m.name; input.classList.add('bad');
    setTimeout(() => input.classList.remove('bad'), 1500);
    return;
  }
  input.value = name;
  if (name === m.name) return;
  markerNote(`renamed "${m.name}" to "${name}"`);
  m.name = name;
  markersChanged();
}
/** Frame one marker, keeping the view direction and the far plane of the whole scene. */
function focusMarker(m) {
  if (!m) return;
  const box = new THREE.Box3();
  for (const [a, b] of outline(m)) box.expandByPoint(a).expandByPoint(b);
  if (m.kind === 'site') box.expandByPoint(V3(m.points[0]));
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 0.5);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (!Number.isFinite(dir.x) || dir.length() < 0.5) dir.set(0.6, 0.45, 0.7).normalize();
  camera.position.copy(c).addScaledVector(dir, (r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.4);
  camera.near = Math.min(camera.near, r / 100000); camera.far = Math.max(camera.far, r * 100); camera.updateProjectionMatrix();
  controls.target.copy(c);
}
function markerRow(id) {
  const row = el('div', 'mk'), dot = el('span', 'dot'), name = el('input'), kind = el('span', 'mt'), del = el('button', 'ib', '×');
  name.type = 'text'; name.spellcheck = false; name.maxLength = 100;
  del.title = 'delete this marker';
  row.append(dot, name, kind, del);
  row.onclick = (e) => { if (e.target === name || e.target === del) return; selectMarker(id); focusMarker(markerById(id)); };
  name.onfocus = () => { if (mk.selected !== id) selectMarker(id); };
  name.onkeydown = (e) => {
    if (e.key === 'Enter') name.blur();
    else if (e.key === 'Escape') { name.value = markerById(id)?.name ?? ''; name.classList.remove('bad'); name.blur(); }
  };
  name.onchange = () => renameMarker(id, name);
  del.onclick = () => deleteMarker(id);
  return {
    el: row,
    update(m) {
      dot.style.background = hex(KINDS[m.kind].color);
      if (document.activeElement !== name) name.value = m.name;
      kind.textContent = m.kind;
      row.title = `${m.kind} "${m.name}" — click to frame it; the name is editable`;
      row.classList.toggle('sel', m.id === mk.selected);
    },
  };
}
function renderMarkerList() {
  const box = $('mk-list');
  $('markers-count').textContent = mk.list.length || '';
  if (!mk.list.length) {
    mk.rows.clear();
    box.replaceChildren(el('div', 'none', 'none yet — pick Site, Path, Zone or Volume, then click in the view; agents read them as inputs/markers.json'));
    return;
  }
  box.querySelector('.none')?.remove();
  // rows are kept (a name being typed stays) and updated in list order
  const seen = new Set();
  let prev = null;
  for (const m of mk.list) {
    seen.add(m.id);
    let r = mk.rows.get(m.id);
    if (!r) { r = markerRow(m.id); mk.rows.set(m.id, r); }
    r.update(m);
    const want = prev ? prev.nextSibling : box.firstChild;
    if (r.el !== want) box.insertBefore(r.el, want);
    prev = r.el;
  }
  for (const [id, r] of mk.rows) if (!seen.has(id)) { r.el.remove(); mk.rows.delete(id); }
}
/** The size field of the selected marker (a site's radius, a volume's height), or of new ones in Site and Volume mode. */
function renderFields() {
  const box = $('mk-fields'), sel = markerById(mk.selected), placing = mk.mode !== 'select' ? mk.mode : null;
  const m = sel && (!placing || sel.kind === placing) ? sel : null;
  const kind = m ? m.kind : placing, key = kind === 'site' ? 'radius' : kind === 'volume' ? 'height' : null;
  const sig = `${m?.id ?? ''}|${kind ?? ''}`;
  if (box.dataset.sig !== sig) {
    box.dataset.sig = sig;
    box.replaceChildren();
    if (key) {
      const row = el('div', 'ctl'), cw = el('div', 'cw'), f = el('input');
      f.type = 'number'; f.min = '0.1'; f.step = 'any'; f.id = 'mk-size';
      f.oninput = () => { const v = Number(f.value); if (f.value.trim() !== '' && Number.isFinite(v) && v > 0) setSize(key, v); };
      f.onchange = () => { const cur = markerById(m?.id); f.value = fmt(cur ? cur[key] : mk.defaults[key]); };
      row.title = (key === 'radius' ? 'the site\'s radius: its pscale in inputs/markers.json' : 'how far the box rises above its lower corner') + (m ? '' : ` (for the next ${kind}s)`);
      cw.append(f);
      row.append(el('span', 'cl', m ? `${key} (m)` : `new ${kind}s: ${key} (m)`), cw);
      box.append(row);
    }
    if (m && !key) box.append(el('div', 'hint', ''));
  }
  const f = $('mk-size');
  if (f && document.activeElement !== f) f.value = fmt(m ? m[key] : mk.defaults[key]);
  const hint = box.querySelector('.hint');
  if (hint && m) hint.textContent = m.kind === 'path' ? `${m.points.length} points · ${num(pathLength(m.points), 1)} m long` : `${m.points.length} corners · ${num(topArea(m.points), 1)} m² seen from above`;
}
function setSize(key, v) {
  mk.defaults[key] = v;
  const m = markerById(mk.selected);
  if (m && key in m && m[key] !== v) { m[key] = v; markersChanged(); }
  else if (mk.draft?.kind === 'volume') drawDraft();
}
function renderMarkers() { drawMarkers(); renderMarkerList(); renderFields(); }
/** How agents will read the marker: its elements and attributes in inputs/markers.json, and how to pick it out. */
function markerInfo(m) {
  const n = { site: 0, path: 0, zone: 0, volume: 0 };
  let points = 0, prims = 0;
  for (const o of mk.list) {
    n[o.kind]++;
    points += o.kind === 'volume' ? 8 : o.points.length;
    prims += o.kind === 'site' ? 0 : o.kind === 'volume' ? 6 : 1;
  }
  const P = m.points, attrs = (cls) => `${cls} name "${m.name}" · role "${m.kind}"`;
  const lines = [`inputs/markers.json · ${m.kind} "${m.name}"${markersBody() === mk.saved ? '' : '  (saving…)'}`];
  if (m.kind === 'site') lines.push(`1 point · ${attrs('point')} · pscale ${num(m.radius)} (the radius, m) · orient [0, 0, 0, 1] · P (${P[0].map((x) => num(x)).join(', ')})`);
  else if (m.kind === 'path') lines.push(`1 open polyline, ${P.length} points, ${num(pathLength(P), 1)} m long · ${attrs('prim')}`);
  else if (m.kind === 'zone') lines.push(`1 closed polygon facing up, ${P.length} points, ${num(topArea(P), 1)} m² seen from above · ${attrs('prim')}`);
  else { const { lo, hi } = boxOf(m); lines.push(`1 closed box: 6 quads facing out, 8 points, ${num(hi.x - lo.x, 1)} × ${num(hi.y - lo.y, 1)} × ${num(hi.z - lo.z, 1)} m from y ${num(lo.y, 1)} · ${attrs('prim')}`); }
  const many = (c, w) => `${c} ${w}${c === 1 ? '' : 's'}`;
  lines.push(`the file: ${many(points, 'point')}, ${many(prims, 'prim')} (${Object.entries(n).filter(([, c]) => c).map(([k, c]) => many(c, k)).join(', ')})`);
  lines.push('read it with {"type":"file","params":{"path":"inputs/markers.json"}}');
  // group patterns split on spaces: "?" matches the space in a glob
  const group = JSON.stringify(`@name=${m.name.replace(/\s/g, '?')}`);
  lines.push(`this one: {"type":"delete","params":{${m.kind === 'site' ? '"class":"point",' : ''}"group":${group},"keep":true}} · every ${m.kind}: "@role=${m.kind}"`);
  return lines;
}

// saving: the whole list, one POST at a time, the latest list wins
const saveMarkers = coalesce(async () => {
  const body = markersBody();
  if (body === mk.saved) return;
  let status = 0, j;
  try {
    const res = await fetch('/api/markers', { method: 'POST', headers: { 'content-type': 'application/json' }, body });
    status = res.status;
    j = await res.json().catch(() => ({}));
  } catch { j = { error: 'the viewer server is not answering' }; }
  if (status === 200 && j.ok) {
    mk.saved = body;
    const file = `inputs/markers.json${inp.where ? ' ' + inp.where : ''}`;
    if (!mk.mode && markersBody() === body) setStatus(j.count ? `${j.count} marker${j.count === 1 ? '' : 's'} saved to ${file} (${j.points} points, ${j.prims} prims)` : `no markers: ${file} removed`, 'ok');
  } else setStatus(`markers not saved — ${j.error ?? `${status}`}`, 'err');
  showInfo();
});
function markersChanged() { renderMarkers(); saveMarkers(); showInfo(); }
async function loadMarkers() {
  const res = await fetch('/api/markers').catch(() => null);
  if (!res?.ok) return;
  const j = await res.json().catch(() => ({}));
  mk.list = Array.isArray(j.markers) ? j.markers : [];
  mk.saved = markersBody();
  if (!markerById(mk.selected)) mk.selected = null;
  for (const k of ['radius', 'height']) { const last = mk.list.findLast((m) => m[k] > 0); if (last) mk.defaults[k] = last[k]; }
  if (j.error) setStatus(j.error, 'err');
  renderMarkers(); showInfo();
}
for (const b of document.querySelectorAll('#mk-modes button')) b.onclick = () => { setMode(b.dataset.mode); b.blur(); };

// ------------------------------------------------------------ wiring
$('graph').onchange = (e) => {
  state.graph = e.target.value; state.framed = false;
  state.follow = true; state.node = null; $('follow').classList.add('on');
  renderNodes(); renderControls(state.graphs.find((g) => g.name === state.graph)); loadGeo();
};
$('follow').onclick = () => { state.follow = true; $('follow').classList.add('on'); renderNodes(); loadGeo(); };
$('wire').onclick = () => { state.wire = !state.wire; $('wire').classList.toggle('on', state.wire); if (current) applyWire(current); };
$('frame').onclick = frameAll;
$('infobtn').onclick = () => { state.infoOpen = !state.infoOpen; showInfo(); };

const es = new EventSource('/api/events');
let opened = false;
es.onopen = () => {
  setStatus(LIVE);
  modeStatus();
  // after a reconnect the server may have restarted: fetch everything again
  if (opened) { refreshGraphs().then(loadGeo); refreshInputs(); loadWhere(); loadMarkers(); }
  opened = true;
};
es.onerror = () => { setStatus('disconnected (server stopped?)', 'err'); };
es.onmessage = async (m) => {
  const ev = JSON.parse(m.data);
  if (ev.inputs !== undefined) { refreshInputs(); return; }
  if (!state.graph) state.graph = ev.graph;
  await refreshGraphs();
  if (ev.graph === state.graph) loadGeo();
};
renderMarkers();
await refreshGraphs();
loadGeo();
refreshInputs();
loadWhere();
loadMarkers();
</script>
</body>
</html>
