<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopoTopo Viewer</title>
<link rel="icon" href="data:,">
<!-- the viewer page: ES modules from /app/, three.js from /vendor/three/, no build step -->
<link rel="stylesheet" href="/app/style.css">
<link rel="stylesheet" href="/app/outputs.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<script type="module" src="/app/main.js"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <label class="tb" title="the graph shown">graph <select id="graph"></select></label>
    <label class="tb" title="the current view's camera; see ? for active key bindings">view <select id="view-cam"></select></label>
    <label class="tb" title="the current view's shading; see ? for active key bindings">shading <select id="view-shading"></select></label>
    <span class="tb readout" id="step" title="the current view's grid step"></span>
    <button class="tb" id="quad" title="single / quad view">quad</button>
    <span class="grow"></span>
    <button class="tb" id="scene-view" title="back to the whole scene after looking at one output">Scene</button>
    <span class="tb mode" id="mode"></span>
    <label class="tb" title="keyboard and mouse bindings, remembered in this browser">keymap <select id="preset"></select></label>
    <button class="tb" id="help" title="the keymap (?)">?</button>
  </header>
  <aside id="outliner" class="panel">
    <div class="phead tabs" role="tablist" aria-label="Scene, outputs, inputs and packages">
      <button role="tab" id="tab-scene" data-tab="scene" aria-controls="tree">Scene</button>
      <button role="tab" id="tab-outputs" data-tab="outputs" aria-controls="outputs-pane">Outputs <span class="count"></span></button>
      <button role="tab" id="tab-inputs" data-tab="inputs" aria-controls="inputs-pane">Inputs <span class="count"></span></button>
      <button role="tab" id="tab-packages" data-tab="packages" aria-controls="packages-pane" hidden>Packages <span class="count"></span></button>
    </div>
    <div class="pscroll tabpane" id="tree" data-pane="scene" role="tabpanel" aria-labelledby="tab-scene"></div>
    <div class="pscroll tabpane" id="outputs-pane" data-pane="outputs" role="tabpanel" aria-labelledby="tab-outputs"><div id="outputs"></div></div>
    <div class="pscroll tabpane" id="inputs-pane" data-pane="inputs" role="tabpanel" aria-labelledby="tab-inputs">
      <div class="inputs-bar"><button class="primary" id="add-input">Add input…</button><span class="dim" id="inputs-where"></span></div>
      <input id="input-file" type="file" multiple hidden accept=".glb,.gltf,.obj,.stl,.ply,.geo,.bgeo,.blend,.csv,.json,.png,.jpg,.jpeg,.webp">
      <div id="inputs-list"></div>
    </div>
    <div class="pscroll tabpane" id="packages-pane" data-pane="packages" role="tabpanel" aria-labelledby="tab-packages"><div id="packages"></div></div>
    <div class="grip v" data-grip="left" title="drag to resize"></div>
  </aside>
  <main id="viewport">
    <canvas id="gl"></canvas>
    <div id="views"></div>
    <div id="boxsel" hidden></div>
  </main>
  <aside id="props" class="panel">
    <div class="grip v" data-grip="right" title="drag to resize"></div>
    <div class="phead">Properties</div>
    <div id="output-details" hidden></div>
    <div class="pscroll" id="props-body"></div>
    <div class="grip h" data-grip="split" title="drag to resize"></div>
    <div class="phead">Controls <span class="count" id="controls-count"></span></div>
    <div id="controls-bar">
      <div class="cookline" id="controls-cook"><span class="cdot"></span><span class="ctext"></span><button class="cstop" type="button" title="stop the cook at the next node">Stop</button></div>
      <div class="sessionline" id="controls-session" hidden><span class="stext"></span><button id="vars-save" type="button">Save values</button><button id="vars-reset" type="button">Reset all</button></div>
    </div>
    <div class="pscroll" id="controls"></div>
  </aside>
  <footer id="status">
    <span id="msg"></span>
    <span id="ask" hidden><span id="ask-text"></span><button id="ask-yes">Yes</button><button id="ask-no">No</button></span>
    <span class="grow"></span>
    <span class="cookline" id="status-cook"><span class="cdot"></span><span class="ctext"></span><button class="cstop" type="button" title="stop the cook at the next node">Stop</button></span>
    <span id="cook"></span>
  </footer>
</div>
<div id="drop">drop files to add them to <span id="drop-where">inputs/</span><br><small>they show in the Inputs tab and as reference layers in the view</small></div>
</body>
</html>
