[package]
name = "topotopo-open"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "The no-window Windows launcher that runs `topotopo open` for a double-clicked package or workspace"
repository = "https://github.com/topotopo-dev/topotopo"
publish = false

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
